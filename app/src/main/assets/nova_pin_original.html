<!DOCTYPE html>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    .material-symbols-fill {
      font-variation-settings: 'FILL' 1, 'wght' 500;
    }
    .glow-vault {
      box-shadow: 0 16px 36px -10px rgba(37, 99, 235, 0.28), 0 0 0 1px rgba(37, 99, 235, 0.12);
    }
    .key-tap {
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease;
    }
    .key-tap:active {
      transform: scale(0.92);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-0 md:p-space-xl selection:bg-primary-fixed selection:text-on-primary-fixed antialiased">
<!-- Virtual Phone Vault Chassis / Security Shell Frame -->
<div class="relative w-full max-w-[420px] h-screen md:h-[870px] bg-surface-container-lowest md:rounded-xl shadow-2xl flex flex-col justify-between overflow-hidden border border-outline-variant/30">
<!-- Top Security Bar (Linear/Task focused suppression of global nav) -->
<header class="w-full pt-space-xl pb-space-sm px-space-lg flex items-center justify-between z-20">
<!-- Back to Browser action -->
<button aria-label="Back to Browser" class="flex items-center gap-space-xs py-space-xs px-space-sm rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md">Browser</span>
</button>
<!-- Sandboxed Security Status Badge -->
<div class="inline-flex items-center gap-1.5 py-1 px-space-md rounded-full bg-surface-container text-primary font-label-sm text-label-sm border border-outline-variant/40 tracking-wider">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span>SANDBOXED</span>
<span class="material-symbols-outlined text-[13px] material-symbols-fill" data-icon="lock">lock</span>
</div>
</header>
<!-- Main Authentication Content -->
<main class="w-full flex-1 flex flex-col items-center justify-start px-space-xl pt-space-xs pb-space-md">
<!-- Center Hero Shield & Lock Icon -->
<div class="relative flex items-center justify-center mb-space-md mt-space-xs">
<div class="absolute w-24 h-24 rounded-full bg-primary-fixed/60 blur-xl"></div>
<div class="relative w-16 h-16 rounded-full bg-surface-container-lowest glow-vault flex items-center justify-center text-primary-container border border-surface-container">
<span class="material-symbols-outlined text-[32px] material-symbols-fill" data-icon="shield">shield</span>
<span class="material-symbols-outlined text-[16px] text-on-primary absolute" data-icon="lock" style="font-variation-settings: 'wght' 700;">lock</span>
</div>
</div>
<!-- Title & Subtitle -->
<div class="text-center max-w-[280px] mb-space-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight mb-1">
          My Private Space
        </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
          Enter 4-digit PIN to access your private web applications
        </p>
</div>
<!-- 4 PIN Dot Indicators (3 filled blue, 1 unfilled light circle) -->
<div aria-label="PIN entry progress" class="flex items-center justify-center gap-space-md mb-space-lg">
<!-- Dot 1: Filled Blue -->
<div class="w-3.5 h-3.5 rounded-full bg-primary-container shadow-sm transform scale-100 transition-transform"></div>
<!-- Dot 2: Filled Blue -->
<div class="w-3.5 h-3.5 rounded-full bg-primary-container shadow-sm transform scale-100 transition-transform"></div>
<!-- Dot 3: Filled Blue -->
<div class="w-3.5 h-3.5 rounded-full bg-primary-container shadow-sm transform scale-100 transition-transform"></div>
<!-- Dot 4: Unfilled Light Circle -->
<div class="w-3.5 h-3.5 rounded-full border-2 border-outline-variant bg-surface-container-low"></div>
</div>
<!-- Secondary Biometric Pill Button -->
<div class="mb-space-lg">
<button class="group flex items-center gap-2 py-2 px-space-lg rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface border border-outline-variant/50 transition-all duration-200 active:scale-95 shadow-sm" type="button">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="fingerprint">fingerprint</span>
<span class="font-label-md text-label-md text-on-surface font-medium">Unlock with Face ID / Fingerprint</span>
</button>
</div>
<!-- Tactile Circular Dial Pad (Numbers 1-9 with Sub-letters, bottom row) -->
<div class="w-full max-w-[290px] grid grid-cols-3 gap-x-5 gap-y-3.5 justify-items-center">
<!-- Key 1 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">1</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5"> </span>
</button>
<!-- Key 2 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">2</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">ABC</span>
</button>
<!-- Key 3 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">3</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">DEF</span>
</button>
<!-- Key 4 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">4</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">GHI</span>
</button>
<!-- Key 5 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">5</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">JKL</span>
</button>
<!-- Key 6 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">6</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">MNO</span>
</button>
<!-- Key 7 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">7</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">PQRS</span>
</button>
<!-- Key 8 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">8</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">TUV</span>
</button>
<!-- Key 9 -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">9</span>
<span class="font-label-sm text-[9px] text-outline font-medium tracking-widest mt-0.5">WXYZ</span>
</button>
<!-- Bottom Row Left: Biometrics Trigger Action -->
<button aria-label="Biometric Authentication" class="key-tap w-[68px] h-[68px] rounded-full flex items-center justify-center text-primary hover:bg-surface-container focus:outline-none" type="button">
<span class="material-symbols-outlined text-[26px]" data-icon="fingerprint">fingerprint</span>
</button>
<!-- Bottom Row Center: Key 0 (+) -->
<button class="key-tap w-[68px] h-[68px] rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 flex flex-col items-center justify-center select-none shadow-sm focus:outline-none" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">0</span>
<span class="font-label-sm text-[10px] text-outline font-medium leading-none mt-0.5">+</span>
</button>
<!-- Bottom Row Right: Delete / Backspace -->
<button aria-label="Backspace" class="key-tap w-[68px] h-[68px] rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="backspace">backspace</span>
</button>
</div>
</main>
<!-- Footer Privacy & Security Guarantee -->
<footer class="w-full pb-space-lg pt-space-xs px-space-lg flex flex-col items-center justify-center text-center">
<div class="flex items-center justify-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm tracking-wide">
<span class="material-symbols-outlined text-[14px] text-primary" data-icon="verified_user">verified_user</span>
<span>Hardware encrypted • Isolated web container</span>
</div>
<!-- Home gesture bar simulator -->
<div class="w-28 h-1 bg-outline-variant/60 rounded-full mt-3"></div>
</footer>
</div>
</body></html>
